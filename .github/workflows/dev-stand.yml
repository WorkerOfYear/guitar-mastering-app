# Push to dev → check the code, then server/dev-stand/deploy.sh builds and copies it to the test stand on the owner's server.
# The deploy steps live in that script so they change with ordinary commits (editing this file needs the `workflow` permission).
# Secrets (Settings → Secrets and variables → Actions): STAND_HOST, STAND_USER, STAND_SSH_KEY,
# optional STAND_PORT (default 22) and STAND_PATH (default /srv/guitar-dev/dist).
name: dev → test stand

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-stand
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      - name: Build and copy to the server
        env:
          HOST: ${{ secrets.STAND_HOST }}
          USER: ${{ secrets.STAND_USER }}
          PORT: ${{ secrets.STAND_PORT || '22' }}
          TARGET: ${{ secrets.STAND_PATH || '/srv/guitar-dev/dist' }}
          KEY: ${{ secrets.STAND_SSH_KEY }}
        run: bash server/dev-stand/deploy.sh
