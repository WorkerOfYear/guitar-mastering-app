# Test stand: the same services as production (server/production), with their own data, plus Caddy serving the built app
# and a Cloudflare quick tunnel giving it an https address. Caddy is published on 127.0.0.1:8788 and is the tunnel's target;
# the API asks the tunnel's metrics (tunnel:2000) for its current address and points the Telegram bot there (server/api/tunnel.ts);
# /api goes to the stand's API, which reaches its own audio and score services as audio:8080 / score:8080.
# Nothing here depends on which checkout runs it: the Caddyfile, the built app and API, data and secrets live in $STAND_DIR
# (default /srv/guitar-dev), put there by up.sh. Secrets as in production: .env (API), audio.env, score.env.
#   bash server/dev-stand/up.sh
#   docker compose logs tunnel | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1
services:
  web:
    image: caddy:2
    restart: unless-stopped
    ports: ["127.0.0.1:8788:80"]
    volumes:
      - ${STAND_DIR:-/srv/guitar-dev}/Caddyfile:/etc/caddy/Caddyfile:ro
      # The whole folder, not dist itself: up.sh swaps dist for a new copy by renaming.
      - ${STAND_DIR:-/srv/guitar-dev}:/srv:ro
  api:
    image: node:22-alpine
    container_name: guitar-dev-api
    restart: unless-stopped
    working_dir: /srv/api
    env_file:
      - { path: "${STAND_DIR:-/srv/guitar-dev}/.env", required: false }
      - { path: "${STAND_DIR:-/srv/guitar-dev}/audio.env", required: false }
      - { path: "${STAND_DIR:-/srv/guitar-dev}/score.env", required: false }
    environment:
      PORT: "8789"
      HOST: 0.0.0.0
      DATA_DIR: /data
      AUDIO_URL: http://audio:8080
      SCORE_URL: http://score:8080
      TUNNEL_METRICS: http://tunnel:2000
      NODE_NO_WARNINGS: "1"
    command: ["sh", "-c", "until [ -f api.js ]; do sleep 5; done; exec node api.js"]
    volumes:
      - ${STAND_DIR:-/srv/guitar-dev}/api:/srv/api:ro
      - ${STAND_DIR:-/srv/guitar-dev}/data:/data
  audio:
    build: ../youtube-audio
    restart: unless-stopped
    env_file: [{ path: "${STAND_DIR:-/srv/guitar-dev}/audio.env", required: false }]
    environment:
      PORT: "8080"
    volumes:
      - ${STAND_DIR:-/srv/guitar-dev}/audio:/data
  score:
    build: ../score-download
    restart: unless-stopped
    env_file: [{ path: "${STAND_DIR:-/srv/guitar-dev}/score.env", required: false }]
    environment:
      PORT: "8080"
    volumes:
      - ${STAND_DIR:-/srv/guitar-dev}/score:/data
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://web:80
  # A quick tunnel Cloudflare has forgotten never comes back by itself: cloudflared keeps retrying the same dead address.
  # /ready answers 503 while it has no connection; after 5 minutes of that a restart gets a new address, which the API
  # then passes on to the bot (server/api/tunnel.ts). Needs the docker socket for the restart; opens no ports.
  tunnel-watch:
    image: docker:cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        fails=0
        while sleep 60; do
          if wget -q -T 10 -O /dev/null http://tunnel:2000/ready; then fails=0; else fails=$$((fails + 1)); fi
          if [ "$$fails" -ge 5 ]; then
            echo "tunnel: no connection for $$fails minutes, restarting"
            docker restart dev-stand-tunnel-1 && fails=0
          fi
        done
