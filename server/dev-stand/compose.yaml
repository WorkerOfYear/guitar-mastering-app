# Test stand: serves $STAND_DIR/dist with its own API (server/api) on 127.0.0.1:8788 and publishes it with a Cloudflare quick tunnel.
# Everything is on the host network, so the API reaches the audio and MuseScore servers at 127.0.0.1:8787 / :8790.
# Nothing here depends on which checkout runs it: the Caddyfile, the API and the secrets live in $STAND_DIR (up.sh puts them there).
#   docker compose up -d
#   docker compose logs tunnel | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1
services:
  web:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${STAND_DIR:-/srv/guitar-dev}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${STAND_DIR:-/srv/guitar-dev}:/srv
  # The API, bundled into $STAND_DIR/api/api.js by up.sh, which restarts the container after each deploy.
  # Its library and files: $STAND_DIR/data. Secrets (APP_PASSWORD, AUDIO_KEY, SCORE_KEY, TAVILY_API_KEY…): $STAND_DIR/.env, not in git.
  api:
    image: node:22-alpine
    container_name: guitar-dev-api
    restart: unless-stopped
    network_mode: host
    working_dir: /srv/api
    env_file: [{ path: "${STAND_DIR:-/srv/guitar-dev}/.env", required: false }]
    environment:
      PORT: "8789"
      HOST: 127.0.0.1
      DATA_DIR: /data
      NODE_NO_WARNINGS: "1"
    command: ["sh", "-c", "until [ -f api.js ]; do sleep 5; done; exec node api.js"]
    volumes:
      - ${STAND_DIR:-/srv/guitar-dev}/api:/srv/api:ro
      - ${STAND_DIR:-/srv/guitar-dev}/data:/data
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --url http://127.0.0.1:8788
