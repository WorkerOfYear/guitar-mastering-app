# The production API (the site on Vercel talks to it): $API_DIR/api/api.js, library and files in $API_DIR/data,
# secrets in $API_DIR/.env. Host network: it reaches the audio and MuseScore servers at 127.0.0.1:8787 / :8790 and
# listens on 127.0.0.1:8791 only — HTTPS from outside comes from Tailscale Funnel (README.md). Deployed by up.sh.
name: guitar-api
services:
  api:
    image: node:22-alpine
    container_name: guitar-api
    restart: unless-stopped
    network_mode: host
    working_dir: /srv/api
    env_file: [{ path: "${API_DIR:-/srv/guitar}/.env", required: false }]
    environment:
      PORT: "8791"
      HOST: 127.0.0.1
      DATA_DIR: /data
      NODE_NO_WARNINGS: "1"
    command: ["sh", "-c", "until [ -f api.js ]; do sleep 5; done; exec node api.js"]
    volumes:
      - ${API_DIR:-/srv/guitar}/api:/srv/api:ro
      - ${API_DIR:-/srv/guitar}/data:/data
